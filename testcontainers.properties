# Testcontainers runtime configuration (PTEH-V1)
# Single client strategy: Unix socket (podman rootless, DOCKER_HOST=unix://...)
docker.client.strategy=org.testcontainers.dockerclient.UnixSocketClientProviderStrategy
# RYUK_POLICY_V1 = DISABLED_BY_CONTRACT:
# - rootless podman; deterministic cleanup owned by test execution
#   (withReuse(false) + JVM shutdown hooks + scripts/test/podman-hermetic.sh stop)
# - container startup concurrency stays bounded (single execution-owned runtime)
ryuk.disabled=true
