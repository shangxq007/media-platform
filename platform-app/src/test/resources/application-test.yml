app:
  security:
    enabled: false
    oauth2:
      enabled: false
      issuerUri: https://test.example.com
      audience: test-audience
  identity:
    api-key-auth-enabled: false
  temporal:
    enabled: false
  ai:
    default-provider: unavailableChatProvider

platform:
  payment:
    webhook:
      allow-unsigned: true
    stripe:
      enabled: false
    hyperswitch:
      enabled: false

render:
  execution:
    mode: local
  providers:
    gstreamer:
      enabled: false
    vapoursynth:
      enabled: false
    natron:
      enabled: false

spring:
  # DataSource + Flyway are injected by the hermetic test runtime
  # (PostgresTestContainerSupport @DynamicPropertySource); the pre-provisioned
  # fixed-port test database is no longer referenced.
  sql:
    init:
      mode: never
  autoconfigure:
    exclude:
      - org.springframework.boot.graphql.autoconfigure.GraphQlAutoConfiguration
      - org.springframework.boot.graphql.autoconfigure.servlet.GraphQlWebMvcAutoConfiguration
      - io.temporal.spring.boot.autoconfigure.RootNamespaceAutoConfiguration
      - io.temporal.spring.boot.autoconfigure.NonRootNamespaceAutoConfiguration
