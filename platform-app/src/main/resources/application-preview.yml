spring:
  task:
    scheduling:
      enabled: false

platform:
  preview:
    enabled: true

  adaptive-engine:
    enabled: false

  ai:
    enabled: false

  workflow:
    enabled: false

  scheduler:
    enabled: false

  worker:
    enabled: false

  worker-queue:
    enabled: false

app:
  # Disable outbox event dispatcher in preview mode to avoid schema mismatch errors
  outbox:
    dispatcher-enabled: false
  security:
    jwt:
      secret-key: ${APP_JWT_SECRET:dev-only-insecure-key-replace-in-production-min-256-bits!!}
      expiration-ms: 86400000
    enabled: false
    dev-auth-endpoint: true
    oidc-dev-bootstrap:
      enabled: false
  identity:
    api-key-auth-enabled: false
  secrets:
    vault:
      enabled: false
  sandbox:
    enabled: false
  storage:
    local-root: /tmp/platform
