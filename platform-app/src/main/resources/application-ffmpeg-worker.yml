# Profile: the single runtime-grouped platform ffmpeg worker (COVER-THUMBNAIL-REBUILD-001,
# action 3 / EXEC-CAN-009). It hosts the ffmpeg frame-extract capabilities media.cover-image and
# media.thumbnail on the shared canonical queue. Overrides the base temporal worker list by profile
# precedence: exactly one worker, and this process never polls workflow-process.
platform:
  runtime:
    role: WORKER
  ffmpeg-worker:
    # Bounded V1 host registration scratch root (P2-5b-2a-1-2): the temporary-storage capacity/
    # usage the registration probe reports is this volume's file store.
    work-root: ${FFMPEG_WORKER_WORK_ROOT:/tmp/media-platform-ffmpeg-worker}
    # P2-5b-2b-1a provider plugin wiring (mirrors the remote worker's app.remote-worker.* keys).
    # The typed PF4J provider plugin JARs are loaded from this directory when the worker starts;
    # a missing directory fails the worker context closed.
    plugins-directory: ${FFMPEG_WORKER_PLUGINS_DIRECTORY:./.data/ffmpeg-worker-plugins}
    # Bounded workspace root handed to every provider runtime binding.
    workspace-root: ${FFMPEG_WORKER_PLUGIN_WORKSPACE_ROOT:/tmp/media-platform-ffmpeg-worker/plugin-workspace}
    # Provider runtime bounding applied to each catalog-derived runtime binding.
    plugin-timeout: ${FFMPEG_WORKER_PLUGIN_TIMEOUT:PT1M}
    plugin-capture-bytes: ${FFMPEG_WORKER_PLUGIN_CAPTURE_BYTES:67108864}
    # P2-5b-2b-1b: staging root the closed loop publishes provider output through.
    staging-root: ${FFMPEG_WORKER_STAGING_ROOT:/tmp/media-platform-ffmpeg-worker/staging}
    sandbox:
      bwrap: ${FFMPEG_WORKER_BWRAP_PATH:/usr/bin/bwrap}
      ffmpeg: ${FFMPEG_WORKER_FFMPEG_PATH:/usr/bin/ffmpeg}
      ffprobe: ${FFMPEG_WORKER_FFPROBE_PATH:/usr/bin/ffprobe}
  cover-image:
    work-root: ${COVER_IMAGE_WORK_ROOT:./.data/cover-image-work}
    materialization-root: ${COVER_IMAGE_MATERIALIZATION_ROOT:./.data/cover-image-materialized}
    materialization-capacity-bytes: ${COVER_IMAGE_MATERIALIZATION_CAPACITY_BYTES:1073741824}

app:
  temporal:
    enabled: true
    namespace: ${TEMPORAL_NAMESPACE:media-platform-dev}
    task-queue: media-platform-tasks
    worker-required: true

spring:
  main:
    web-application-type: none
  temporal:
    start-workers: true
    workers-auto-discovery:
      packages:
        - com.example.platform.coverimage
        - com.example.platform.thumbnail
    workers:
      - task-queue: media-platform-tasks
        name: ffmpeg-worker
