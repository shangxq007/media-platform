# Local development profile using real PostgreSQL.
# Preferred for manual review and release validation.
# Requires a running PostgreSQL instance (local Docker or Neon staging).
#
# Usage:
#   SPRING_PROFILES_ACTIVE=dev-postgres ./gradlew :platform-app:bootRun
#
# Or with explicit connection:
#   SPRING_DATASOURCE_URL=<injected> \
#   SPRING_DATASOURCE_USERNAME=<injected> \
#   SPRING_DATASOURCE_PASSWORD=<injected> \
#   SPRING_PROFILES_ACTIVE=dev-postgres ./gradlew :platform-app:bootRun

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  main:
    allow-circular-references: true

app:
  security:
    enabled: false
    dev-auth-endpoint: false
    oidc-dev-bootstrap:
      enabled: false
  identity:
    api-key-auth-enabled: false
  secrets:
    vault:
      enabled: false
  render:
  sandbox:
    enabled: false

render:
platform:
  preview:
    enabled: true
  adaptive-engine:
    enabled: false
  worker:
    enabled: false
  scheduler:
    enabled: false
  ai:
    enabled: false
