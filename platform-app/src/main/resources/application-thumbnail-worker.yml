platform:
  runtime:
    role: WORKER
  thumbnail:
    sandbox:
      bwrap: ${THUMBNAIL_BWRAP_PATH:/usr/bin/bwrap}
      ffmpeg: ${THUMBNAIL_FFMPEG_PATH:/usr/bin/ffmpeg}
      ffprobe: ${THUMBNAIL_FFPROBE_PATH:/usr/bin/ffprobe}

app:
  temporal:
    enabled: true
    namespace: ${TEMPORAL_NAMESPACE:media-platform-dev}
    task-queue: media-platform-tasks
    worker-required: true

spring:
  main:
    web-application-type: none
  temporal:
    start-workers: true
    workers-auto-discovery:
      # Scalar form is load-bearing, not cosmetic: Spring Boot flattens a YAML list into indexed keys
      # (packages[0], ...), and PlatformRuntimeRoleGuard validates this key with a plain
      # getProperty(key, String[].class) lookup, which cannot see indexed keys and would therefore
      # fail the worker role closed. The Temporal starter binds the same comma-separated scalar to its
      # List<String> discovery packages.
      packages: com.example.platform.thumbnail
    workers:
      - task-queue: media-platform-tasks
        name: thumbnail-worker
