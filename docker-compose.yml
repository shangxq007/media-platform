# Media Platform — Local Development with Docker Compose
# Usage: docker compose up --build

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be supplied by the local bootstrap}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/platform
      SPRING_DATASOURCE_USERNAME: platform
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD must be supplied by the local bootstrap}
      SPRING_FLYWAY_URL: ${SPRING_FLYWAY_URL:?SPRING_FLYWAY_URL must be supplied by the local bootstrap}
      SPRING_FLYWAY_USER: ${SPRING_FLYWAY_USER:?SPRING_FLYWAY_USER must be supplied by the local bootstrap}
      SPRING_FLYWAY_PASSWORD: ${SPRING_FLYWAY_PASSWORD:?SPRING_FLYWAY_PASSWORD must be supplied by the local bootstrap}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET must be supplied by the local bootstrap}
      APP_STORAGE_LOCAL_ROOT: /data/storage
    volumes:
      - app-storage:/data/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  app-storage:
