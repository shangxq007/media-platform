  required_foundations: [Traditional NLE P1 frontend, Timeline V2, Media V2, Audio V2, Source bindings, Export pipeline]
  success_criteria: [publishable video exported from the NLE surface, deterministic edit semantics preserved, external tool escape rate measured]
  metrics:
    - production completion
    - export success
    - external tool escape rate
    - manual workaround count
    - failure/retry count
    - edit-to-publish time
  artifacts: []
  next_trigger: Traditional NLE P1 product surface lands
  notes: Distinct from the CLOSED FRMC milestone (2026-08-15) which validated the canonical stack through a harness (first-real-media-cut-v1.md). This project validates the product surface.

