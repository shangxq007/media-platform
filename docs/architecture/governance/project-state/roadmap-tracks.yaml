- id: EXTERNAL_INTEGRATION_AND_WEBHOOK_FOUNDATION
  status: PLANNED_DEFERRED
  purpose: External APIs, typed adapters, callbacks, polling, streaming, inbound/outbound Webhooks, direct data-plane upload/delivery, edge transforms, protocol mediation, and replaceable serverless observer/access-edge mechanics.
  architecture:
  - 'Inbound: External System -> WebhookIngress -> authentication/signature/trust validation -> normalization -> typed Observation / Command / Event -> canonical application/runtime authority'
  - 'Outbound: committed canonical state/event -> Transactional Outbox -> subscription/delivery resolution -> WebhookDeliveryAdapter -> HTTP/Camel -> external consumer'
  - 'Remote execution: durable submission/event -> authenticated callback preferred, otherwise bounded poller -> attempt/generation-fenced ExecutionObservation -> platform completion/Artifact authority'
  - 'Direct upload: platform bounded storage grant -> client/storage data plane -> trusted validation/finalization -> Artifact authority'
  - 'Private delivery: platform access policy/Artifact authorization -> ephemeral signed mechanics -> storage/CDN data plane'
  - 'Edge transform: delivery-only unless explicitly lowered to platform Operation/ExecutableTask, staging, publication, Artifact, and fenced completion'
  current_dependencies: Typed domain events, transactional outbox, execution observations, provider/runtime foundations.
  next_actions:
  - EXTERNAL_INTEGRATION_RUNTIME when the first concrete external service integration requires it
  - AI_REMOTE_PROVIDER_CONFORMANCE when a remote operation outlives a synchronous request, offers callbacks, or requires polling
  - INBOUND_WEBHOOK_RUNTIME at the first authenticated inbound webhook integration
  - OUTBOUND_WEBHOOK_RUNTIME at the first outbound transactional delivery product need
  - DIRECT_LARGE_WEB_UPLOAD when browser/client media size or throughput makes application byte proxying inappropriate
  - PRIVATE_DELIVERY_SIGNED_ACCESS when a private Artifact must be delivered directly through storage/CDN
  - EDGE_TRANSFORM_CLASSIFICATION when an edge output is proposed as reusable, canonical, provenance-bearing, or a later execution input
  roadmap_relationship: '#22 Provider/runtime foundations -> later real AI Provider integration; technology != authority.'
  validation_target: EVENT_SUBSCRIPTION_WEBHOOK_CONFORMANCE
  explicit_boundaries:
  - No synchronous external HTTP call may become part of canonical DB commit authority
  - Long waits use durable async state; callback preferred, otherwise bounded attempt/generation-fenced polling
  - Semantics stay in core compute and external complexity stays behind typed adapters
  - Workflow owns durable process; Temporal is replaceable orchestration; Apache Camel/native HTTP/Workers/Lambda are mechanics only
  - Edge is data/access plane, not canonical media or Artifact authority
  - Application control plane does not proxy large media bytes by default
  explicit_exclusions:
  - No Apache Camel runtime implementation now
  - No Webhook runtime now
  - No event subscription APIs now
  - No Serverless ExecutionBackend without a concrete ExecutableTask use case and separate adoption
  - No mandatory Cloudflare Workers, AWS Lambda, serverless, edge, CDN, or signing-provider production dependency
