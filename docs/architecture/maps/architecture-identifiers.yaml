    dep.postgresql: PostgreSQL service
    dep.object-storage: object storage/shared filesystem
relationships:
  - from: mod.platform-app
    to: mod.workflow
    kind: composes
  - from: mod.workflow
    to: auth.temporal
    kind: orchestrates
  - from: auth.temporal
    to: mod.provider-runtime
    kind: activity-boundary
  - from: mod.provider-runtime
    to: auth.storage
    kind: writes-artifacts
  - from: mod.platform-app
    to: auth.postgres
    kind: persists
