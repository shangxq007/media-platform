openapi: 3.1.0
info:
  title: media-api
  version: 3.2.0
  x-lifecycle: STABLE
  x-contract-id: media-api
  x-composition-version-range-grammar: composition-version-range-v1
  x-composition-version-range-grammar-document: docs/api/composition-version-range.md
  description: >
    VERSION_COMPATIBILITY_GOVERNANCE_FOUNDATION_V1 baseline. The OpenAPI document
    is authority for the EXTERNAL HTTP TRANSPORT CONTRACT only — it is NOT Media
    domain schema, Timeline canonical schema, capability semantic authority or
    revision authority (TRANSPORT_SCHEMA_IS_A_PROJECTION_NOT_DOMAIN_AUTHORITY_V1).
servers:
  - url: /api
paths:
  /composition/capabilities:
    get:
      operationId: listCapabilityAvailability
      summary: Read provider-neutral capability availability
      responses: {'200': {description: Capability availability catalog}}
  /composition/workflows/drafts:
    post:
      operationId: saveTemplateWorkflowDraft
      summary: Save a Template Workflow draft
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TemplateWorkflow'}}}}
      responses: {'200': {description: Draft saved}}
  /composition/workflows/validate:
    post:
      operationId: validateTemplateWorkflow
      summary: Validate a Template Workflow without execution
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TemplateWorkflow'}}}}
      responses: {'200': {description: Validation result}}
  /composition/workflows/drafts/{id}:
    get:
      operationId: getTemplateWorkflowDraft
      summary: Get a workspace-owned workflow draft
      parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: workspaceId, in: query, required: true, schema: {type: string}}]
      responses: {'200': {description: Draft}}
    put:
      operationId: updateTemplateWorkflowDraft
      summary: Update a workflow draft with optimistic concurrency
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TemplateWorkflow'}}}}
      responses: {'200': {description: Draft saved}, '409': {description: Stale draft}}
  /composition/workflows/drafts/{id}/publish:
    post:
      operationId: publishTemplateWorkflow
      summary: Publish a validated workflow draft
      parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: workspaceId, in: query, required: true, schema: {type: string}}]
      responses: {'200': {description: Published immutable version}}
  /composition/workflows/versions/{id}/{version}:
    get:
      operationId: getTemplateWorkflowVersion
      summary: Get an immutable workflow version
      parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: version, in: path, required: true, schema: {type: string}}, {name: workspaceId, in: query, required: true, schema: {type: string}}]
      responses: {'200': {description: Immutable version}}
  /composition/applications/drafts:
    post:
      operationId: saveApplicationDraft
      summary: Save an Application draft
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Application'}}}}
      responses: {'200': {description: Draft saved}}
  /composition/applications/validate:
    post:
      operationId: validateApplication
      summary: Validate an Application without execution
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Application'}}}}
      responses: {'200': {description: Validation result}}
  /composition/applications/drafts/{id}:
    get:
      operationId: getApplicationDraft
      summary: Get an application draft
      parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: workspaceId, in: query, required: true, schema: {type: string}}]
      responses: {'200': {description: Draft}}
    put:
      operationId: updateApplicationDraft
      summary: Update an application draft with optimistic concurrency
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Application'}}}}
      responses: {'200': {description: Draft saved}, '409': {description: Stale draft}}
  /composition/applications/drafts/{id}/publish:
    post:
      operationId: publishApplication
      summary: Publish a validated application draft
      parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: workspaceId, in: query, required: true, schema: {type: string}}]
      responses: {'200': {description: Published immutable version}}
  /composition/applications/versions/{id}/{version}:
    get:
      operationId: getApplicationVersion
      summary: Get an immutable application version
      parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: version, in: path, required: true, schema: {type: string}}, {name: workspaceId, in: query, required: true, schema: {type: string}}]
      responses: {'200': {description: Immutable version}}
  /render/jobs/{jobId}:
    get:
      operationId: getRenderJob
      summary: Query a render job (transport projection of render execution state)
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Render job projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenderJob"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /timeline/revisions/{revisionId}:
    get:
      operationId: getTimelineRevision
      summary: Fetch an immutable Timeline revision (composition projection)
      parameters:
        - name: revisionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Timeline revision projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineRevision"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /media/assets/{assetId}:
    get:
      operationId: getMediaAsset
      summary: Media asset projection (media-domain logical source)
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Media asset projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAsset"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /composition/scope:
    get:
      operationId: resolveCompositionScope
      summary: Resolve the authenticated workspace scope
      parameters: [{name: workspaceId, in: query, required: false, schema: {type: string}}]
      responses: {'200': {description: Verified tenant/workspace scope}, '401': {description: Unauthenticated}, '403': {description: Ineligible membership}}
  /composition/workflows/publish-readiness:
    post:
      operationId: checkTemplateWorkflowPublishReadiness
      summary: Check workflow publish readiness without execution
      responses: {'200': {description: Typed validation result}}
  /composition/workflows/versions/{id}/compare:
    get:
      operationId: compareTemplateWorkflowVersions
      summary: Compare immutable workflow versions
      parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: workspaceId, in: query, required: true, schema: {type: string}}, {name: left, in: query, required: true, schema: {type: string}}, {name: right, in: query, required: true, schema: {type: string}}]
      responses: {'200': {description: Version comparison}}
  /composition/applications/publish-readiness:
    post:
      operationId: checkApplicationPublishReadiness
      summary: Check application publish readiness without execution
      responses: {'200': {description: Typed validation result}}
  /composition/applications/versions/{id}/compare:
    get:
      operationId: compareApplicationVersions
      summary: Compare immutable application versions
      parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: workspaceId, in: query, required: true, schema: {type: string}}, {name: left, in: query, required: true, schema: {type: string}}, {name: right, in: query, required: true, schema: {type: string}}]
      responses: {'200': {description: Version comparison}}
components:
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    TemplateWorkflow:
      type: object
      required: [id, version, name, steps, bindings, executionModes]
      properties: {id: {type: string}, version: {type: string}, name: {type: string}, steps: {type: array, items: {type: object}}, bindings: {type: array, items: {type: object}}, executionModes: {type: array, items: {type: string}}}
    Application:
      type: object
      required: [id, version, displayName, workflowIds]
      properties: {id: {type: string}, version: {type: string}, displayName: {type: string}, workflowIds: {type: array, items: {type: string}}}
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
      x-error-shape: consistent
    RenderJob:
      type: object
      required: [jobId, status]
      properties:
        jobId:
          type: string
        status:
          type: string
        revisionId:
          type: string
    TimelineRevision:
      type: object
      required: [revisionId, schemaVersion]
      properties:
        revisionId:
          type: string
        schemaVersion:
          type: string
        tracks:
          type: array
          items:
            type: object
    MediaAsset:
      type: object
      required: [assetId]
      properties:
        assetId:
          type: string
        streamId:
          type: string
    CapabilityAvailability:
      type: object
      properties:
        capabilityId: {type: string}
        version: {type: string}
        input: {$ref: '#/components/schemas/ContractRef'}
        output: {$ref: '#/components/schemas/ContractRef'}
        availability: {type: string}
    ContractRef:
      type: object
      required: [name, version]
      properties:
        name: {type: string}
        version: {type: string}
    WorkflowEntry:
      type: object
      required: [name, contract, stepId, port]
      properties:
        name: {type: string}
        contract: {$ref: '#/components/schemas/ContractRef'}
        stepId: {type: string}
        port: {type: string}
    WorkflowOutput:
      type: object
      required: [name, type, stepId, port]
      properties:
        name: {type: string}
        type: {type: string}
        stepId: {type: string}
        port: {type: string}
    ValidationIssue:
      type: object
      required: [code, severity, objectType, objectId, path, location, message]
      properties:
        code: {type: string}
        severity: {type: string}
        objectType: {type: string}
        objectId: {type: string}
        path: {type: string}
        location: {type: string}
        message: {type: string}
    ValidationResult:
      type: object
      required: [ready, issues, snapshotId]
      properties:
        ready: {type: boolean}
        issues: {type: array, items: {$ref: '#/components/schemas/ValidationIssue'}}
        snapshotId: {type: string}
