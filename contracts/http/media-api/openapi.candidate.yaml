openapi: 3.1.0
info:
  title: media-api
  version: 3.2.0
  x-lifecycle: STABLE
  x-contract-id: media-api
  description: >
    VERSION_COMPATIBILITY_GOVERNANCE_FOUNDATION_V1 baseline. The OpenAPI document
    is authority for the EXTERNAL HTTP TRANSPORT CONTRACT only — it is NOT Media
    domain schema, Timeline canonical schema, capability semantic authority or
    revision authority (TRANSPORT_SCHEMA_IS_A_PROJECTION_NOT_DOMAIN_AUTHORITY_V1).
servers:
  - url: /api
paths:
  /tenants/{tenantId}/projects/{projectId}/thumbnails:
    post:
      operationId: submitMediaThumbnail
      summary: Submit a durable timestamped thumbnail extraction
      parameters:
        - {name: tenantId, in: path, required: true, schema: {type: string}}
        - {name: projectId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ThumbnailRequest'}
      responses:
        '200':
          description: Durable thumbnail task
          content: {application/json: {schema: {$ref: '#/components/schemas/ThumbnailTask'}}}
  /tenants/{tenantId}/projects/{projectId}/thumbnails/{taskId}:
    get:
      operationId: getMediaThumbnailTask
      summary: Get thumbnail task status
      parameters:
        - {name: tenantId, in: path, required: true, schema: {type: string}}
        - {name: projectId, in: path, required: true, schema: {type: string}}
        - {name: taskId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Task status, content: {application/json: {schema: {$ref: '#/components/schemas/ThumbnailTask'}}}}
  /tenants/{tenantId}/projects/{projectId}/thumbnails/{taskId}/cancel:
    post:
      operationId: cancelMediaThumbnailTask
      summary: Cancel an admitted or running thumbnail task
      parameters:
        - {name: tenantId, in: path, required: true, schema: {type: string}}
        - {name: projectId, in: path, required: true, schema: {type: string}}
        - {name: taskId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Cancelled task status, content: {application/json: {schema: {$ref: '#/components/schemas/ThumbnailTask'}}}}
  /tenants/{tenantId}/projects/{projectId}/thumbnails/{taskId}/image:
    get:
      operationId: getMediaThumbnailImage
      summary: Retrieve an authorized committed thumbnail image
      parameters:
        - {name: tenantId, in: path, required: true, schema: {type: string}}
        - {name: projectId, in: path, required: true, schema: {type: string}}
        - {name: taskId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Committed image, content: {image/jpeg: {}, image/png: {}}}
  /render/jobs/{jobId}:
    get:
      operationId: getRenderJob
      summary: Query a render job (transport projection of render execution state)
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Render job projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenderJob"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /timeline/revisions/{revisionId}:
    get:
      operationId: getTimelineRevision
      summary: Fetch an immutable Timeline revision (composition projection)
      parameters:
        - name: revisionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Timeline revision projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineRevision"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /media/assets/{assetId}:
    head:
      operationId: headMediaAsset
      summary: Media asset existence probe (additive, non-breaking)
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Exists
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: getMediaAsset
      summary: Media asset projection (media-domain logical source)
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Media asset projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAsset"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
components:
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    ThumbnailRequest:
      type: object
      required: [sourceAssetId, timestampSeconds, idempotencyKey]
      properties:
        sourceAssetId: {type: string}
        timestampSeconds: {type: number, format: double, minimum: 0}
        imageFormat: {type: string, enum: [jpeg, png], default: jpeg}
        width: {type: integer, minimum: 16, maximum: 4096}
        quality: {type: integer, minimum: 1, maximum: 100}
        idempotencyKey: {type: string, minLength: 1}
    ThumbnailTask:
      type: object
      required: [taskId, status]
      properties:
        taskId: {type: string}
        status: {type: string, enum: [ADMITTED, RUNNING, COMMITTING, COMPLETED, FAILED, CANCELLED]}
        artifactId: {type: string, nullable: true}
        failureCode: {type: string, nullable: true}
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
      x-error-shape: consistent
    RenderJob:
      type: object
      required: [jobId, status]
      properties:
        jobId:
          type: string
        status:
          type: string
        revisionId:
          type: string
    TimelineRevision:
      type: object
      required: [revisionId, schemaVersion]
      properties:
        revisionId:
          type: string
        schemaVersion:
          type: string
        tracks:
          type: array
          items:
            type: object
    MediaAsset:
      type: object
      required: [assetId]
      properties:
        assetId:
          type: string
        streamId:
          type: string
