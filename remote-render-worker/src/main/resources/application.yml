server:
  port: 8090
spring:
  application:
    name: remote-render-worker

# Runtime/incarnation, provider executables and credentials must be supplied by the deployment.
# Inputs must already be materialized under this host's root; this endpoint does not transfer Assets.
app:
  remote-worker:
    workspace-root: ${APP_REMOTE_WORKER_ROOT:/tmp/platform-remote-worker}
    plugins-directory: ${APP_REMOTE_WORKER_PLUGINS:plugins}
    timeout: PT1M
    capture-bytes: 67108864
