name: Semgrep Architecture Rules

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  change-impact:
    runs-on: ubuntu-latest
    outputs:
      semgrep_validation: ${{ steps.classify.outputs.semgrep_validation }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base_sha="$PUSH_BASE_SHA"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          fi
          python3 scripts/ci/change_impact_classifier.py \
            --base "$base_sha" --head "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  semgrep:
    runs-on: ubuntu-latest
    needs: change-impact
    if: needs.change-impact.outputs.semgrep_validation == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: semgrep/semgrep-action@v1
        with:
          config: .semgrep/media-platform-architecture.yml
        env:
          SEMGREP_RULES: .semgrep/media-platform-architecture.yml
