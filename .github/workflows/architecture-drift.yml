name: Foundation Verification

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  change-impact:
    runs-on: ubuntu-latest
    outputs:
      architecture_drift: ${{ steps.classify.outputs.architecture_drift }}
      backend_ci: ${{ steps.classify.outputs.backend_ci }}
      formal_verification: ${{ steps.classify.outputs.formal_verification }}
      categories: ${{ steps.classify.outputs.categories }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base_sha="$PUSH_BASE_SHA"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          fi
          python3 scripts/ci/change_impact_classifier.py \
            --base "$base_sha" --head "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  architecture-drift:
    runs-on: ubuntu-latest
    needs: change-impact
    if: needs.change-impact.outputs.architecture_drift == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Script syntax check
        run: bash -n scripts/check-architecture-drift.sh

      - name: Run architecture drift guard
        run: bash scripts/check-architecture-drift.sh

  api-contract-gate-controls:
    runs-on: ubuntu-latest
    needs: change-impact
    # Governance/architecture/contract changes (the classifier maps contracts/**, governance docs and
    # the gate/harness scripts into these two signals), so the four API contract gate controls can
    # never regress silently. A failure here fails the workflow run and blocks the merge.
    if: needs.change-impact.outputs.architecture_drift == 'true' || needs.change-impact.outputs.backend_ci == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22 (contract lint tooling, pinned in contracts/package.json)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned contract tooling
        working-directory: contracts
        run: npm ci --no-audit --no-fund

      - name: Script syntax check
        run: |
          set -euo pipefail
          bash -n scripts/check-api-contract-governance.sh
          bash -n scripts/test/api-contract-governance-gate-controls.sh

      - name: Run API contract governance gate controls
        run: bash scripts/test/api-contract-governance-gate-controls.sh

  foundation-verification:
    runs-on: ubuntu-latest
    needs: change-impact
    if: needs.change-impact.outputs.backend_ci == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Script syntax check
        run: bash -n scripts/verify-pfirr1-jooq-authority-fail-closed.sh && bash -n scripts/ci/setup-test-runtime.sh

      - name: Prove jOOQ authority verification is fail-closed
        run: bash scripts/verify-pfirr1-jooq-authority-fail-closed.sh

      - name: Run bounded PFIRR1 gates
        run: ./gradlew --no-daemon pfirr1RemediationCheck

      - name: Compile production and test sources
        run: ./gradlew --no-daemon compileJava compileTestJava

      - name: Build boot jar smoke check
        run: ./gradlew --no-daemon :platform-app:bootJar -x test

  foundation-policy-summary:
    runs-on: ubuntu-latest
    if: always()
    needs: [change-impact, architecture-drift, authorization-guards, foundation-verification]
    steps:
      - name: Enforce selected Foundation policy
        env:
          CLASSIFIER_RESULT: ${{ needs.change-impact.result }}
          ARCH_REQUIRED: ${{ needs.change-impact.outputs.architecture_drift }}
          ARCH_RESULT: ${{ needs['architecture-drift'].result }}
          GUARDS_REQUIRED: ${{ needs.change-impact.outputs.architecture_drift == 'true' || needs.change-impact.outputs.backend_ci == 'true' }}
          GUARDS_RESULT: ${{ needs['authorization-guards'].result }}
          BACKEND_REQUIRED: ${{ needs.change-impact.outputs.backend_ci }}
          BACKEND_RESULT: ${{ needs['foundation-verification'].result }}
        run: |
          set -euo pipefail
          test "$CLASSIFIER_RESULT" = success
          verify_result() {
            if [ "$1" = true ]; then test "$2" = success; else test "$2" = skipped; fi
          }
          verify_result "$ARCH_REQUIRED" "$ARCH_RESULT"
          verify_result "$GUARDS_REQUIRED" "$GUARDS_RESULT"
          verify_result "$BACKEND_REQUIRED" "$BACKEND_RESULT"

  # ── Authorization surface guards (artifact + timeline) ────────────────────
  # AUTH-INVENTORY-FIX-001: the Artifact source-scan enforcement test, the DB-backed
  # cross-project isolation proof (AUTH-ARTIFACT-BOUNDARY-FIX-002) and the h7-v2
  # controller-authorization law are the controls that keep the authorization boundary from
  # drifting. They are wired here (not only in a module-local job) so a failure blocks the
  # merge through foundation-policy-summary. Runs whenever the architecture or backend signal
  # is set, i.e. whenever authorization-relevant paths change.
  authorization-guards:
    runs-on: ubuntu-latest
    needs: change-impact
    if: needs.change-impact.outputs.architecture_drift == 'true' || needs.change-impact.outputs.backend_ci == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up authoritative test runtime
        run: bash scripts/ci/setup-test-runtime.sh

      - name: Run h7-v2 controller-authorization guard
        run: python3 scripts/guards/h7-v2-architecture-guard.py

      - name: Run Artifact authorization guards
        run: ./gradlew --no-daemon :artifact-module:test --tests '*ArtifactAuthorizationEnforcementTest' --tests '*CrossProjectIsolationTest'

      - name: Run permission-vocabulary consistency guard
        run: ./gradlew --no-daemon :identity-access-module:test --tests '*AuthPermissionVocabularyConsistencyTest'
