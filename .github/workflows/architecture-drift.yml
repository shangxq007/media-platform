name: Foundation Verification

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  change-impact:
    runs-on: ubuntu-latest
    outputs:
      architecture_drift: ${{ steps.classify.outputs.architecture_drift }}
      backend_ci: ${{ steps.classify.outputs.backend_ci }}
      formal_verification: ${{ steps.classify.outputs.formal_verification }}
      categories: ${{ steps.classify.outputs.categories }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base_sha="$PUSH_BASE_SHA"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          fi
          python3 scripts/ci/change_impact_classifier.py \
            --base "$base_sha" --head "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  architecture-drift:
    runs-on: ubuntu-latest
    needs: change-impact
    if: needs.change-impact.outputs.architecture_drift == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Script syntax check
        run: bash -n scripts/check-architecture-drift.sh

      - name: Run architecture drift guard
        run: bash scripts/check-architecture-drift.sh

  foundation-verification:
    runs-on: ubuntu-latest
    needs: change-impact
    if: needs.change-impact.outputs.backend_ci == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Script syntax check
        run: bash -n scripts/verify-pfirr1-jooq-authority-fail-closed.sh && bash -n scripts/ci/setup-test-runtime.sh

      - name: Prove jOOQ authority verification is fail-closed
        run: bash scripts/verify-pfirr1-jooq-authority-fail-closed.sh

      - name: Run bounded PFIRR1 gates
        run: ./gradlew --no-daemon pfirr1RemediationCheck

      - name: Set up test runtime (ffmpeg + container API)
        run: bash scripts/ci/setup-test-runtime.sh

      - name: Run backend tests
        run: ./gradlew --no-daemon test

      - name: Build boot jar smoke check
        run: ./gradlew --no-daemon :platform-app:bootJar -x test

  foundation-policy-summary:
    runs-on: ubuntu-latest
    if: always()
    needs: [change-impact, architecture-drift, foundation-verification]
    steps:
      - name: Enforce selected Foundation policy
        env:
          CLASSIFIER_RESULT: ${{ needs.change-impact.result }}
          ARCH_REQUIRED: ${{ needs.change-impact.outputs.architecture_drift }}
          ARCH_RESULT: ${{ needs['architecture-drift'].result }}
          BACKEND_REQUIRED: ${{ needs.change-impact.outputs.backend_ci }}
          BACKEND_RESULT: ${{ needs['foundation-verification'].result }}
        run: |
          set -euo pipefail
          test "$CLASSIFIER_RESULT" = success
          verify_result() {
            if [ "$1" = true ]; then test "$2" = success; else test "$2" = skipped; fi
          }
          verify_result "$ARCH_REQUIRED" "$ARCH_RESULT"
          verify_result "$BACKEND_REQUIRED" "$BACKEND_RESULT"
