# Local cover-image acceptance stack: Temporal 1.26.2 + MinIO + Postgres.
# Mirrors docker-compose.thumbnail-acceptance.yml; the thumbnail compose file is not modified.
services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform-local-only
    ports: ["55432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U platform -d platform"], interval: 2s, timeout: 2s, retries: 30 }
  temporal:
    image: temporalio/auto-setup:1.26.2
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: platform
      POSTGRES_PWD: platform-local-only
      POSTGRES_SEEDS: postgres
    depends_on: { postgres: { condition: service_healthy } }
    ports: ["7233:7233"]
  storage:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: platform, MINIO_ROOT_PASSWORD: platform-local-only }
    ports: ["59000:9000", "59001:9001"]
