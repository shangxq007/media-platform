# Deployment-level worker-role override for the cover-image worker process.
#
# `spring.config.additional-location` config data is loaded with higher precedence than the packaged
# profile resources, so this file replaces the base `application-temporal.yml` worker list instead of
# being merged with it by index. Result: exactly one worker on the canonical shared queue, and the
# workflow engine's `workflow-process` queue is never polled by this process.
spring:
  temporal:
    workers-auto-discovery:
      packages:
        - com.example.platform.coverimage
    workers:
      - task-queue: media-platform-tasks
        name: cover-image-worker
